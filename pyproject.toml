[project]
name = "code-archaeologist"
version = "1.0.0"
description = "Treats codebases as archaeological sites - discovers artifacts, strata, fossils, and ruins using NVIDIA Nemotron models on Nebius"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "gitpython>=3.1.40",
    "networkx>=3.3",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.0",
    "asyncio-throttle>=1.0.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.111.0", "uvicorn>=0.30.0", "websockets>=12.0"]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0", "mypy>=1.10.0"]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["code_archaeologist*"]
exclude = ["test_project*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
